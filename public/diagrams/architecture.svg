<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
  <title id="t">IBM watsonx Assistant for Z: how a request flows</title>
  <desc id="d">An audit analyst asks a question in plain language. The simulated IBM watsonx Assistant for Z runs four steps: catalog lookup, lineage when the catalog is empty, locate and validate, and seal evidence. The simulated IBM ADDI for IBM Z supplies lineage. A fictional IBM Z estate holds the Db2 catalog, batch jobs and z/OS storage. A DBA reviews the evidence package.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef4fc"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f8fd"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4fc4"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#198038"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6929c4"/></marker>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="58" font-size="52" font-weight="700" fill="#0a1f5c">IBM watsonx Assistant for Z</text>
  <text x="40" y="100" font-size="31" fill="#5b6578">Helping users find and validate IBM Z catalog information</text>

  <!-- Users -->
  <rect x="37" y="123" width="1465" height="143" rx="6" fill="#e9f1fd" stroke="#bcd3f5"/>
  <g fill="#1d4fc4"><circle cx="112" cy="171" r="12"/><circle cx="82" cy="182" r="9"/><circle cx="142" cy="182" r="9"/>
    <path d="M90,214 a22,24 0 0 1 44,0 v5 h-44z"/><path d="M68,214 a15,17 0 0 1 24,-12 v17 h-24z"/><path d="M156,214 a15,17 0 0 0 -24,-12 v17 h24z"/></g>
  <text x="182" y="180" font-size="27" font-weight="700" fill="#0a1f5c">Users</text>
  <text x="182" y="209" font-size="19" fill="#5b6578">Ask questions, get answers,</text>
  <text x="182" y="233" font-size="19" fill="#5b6578">validate information</text>

  <rect x="493" y="136" width="403" height="118" rx="6" fill="#f6f9fe" stroke="#bcd3f5"/>
  <g fill="none" stroke="#0a1f5c" stroke-width="3"><circle cx="579" cy="171" r="14"/><path d="M552,218 a27,27 0 0 1 54,0 z"/></g>
  <text x="661" y="165" font-size="18" font-weight="700" fill="#0a1f5c">Audit analyst</text>
  <rect x="661" y="176" width="219" height="64" rx="10" fill="#fff" stroke="#bcd3f5"/>
  <text x="677" y="203" font-size="18" fill="#0a1f5c">“Find SYSCOPY catalog</text>
  <text x="682" y="226" font-size="18" fill="#0a1f5c">information”</text>

  <rect x="967" y="136" width="411" height="118" rx="6" fill="#f6f9fe" stroke="#bcd3f5"/>
  <g fill="none" stroke="#0a1f5c" stroke-width="3"><circle cx="1054" cy="171" r="14"/><path d="M1027,218 a27,27 0 0 1 54,0 z"/></g>
  <text x="1138" y="165" font-size="18" font-weight="700" fill="#0a1f5c">DBA / mainframe owner</text>
  <rect x="1138" y="176" width="213" height="64" rx="10" fill="#fff" stroke="#bcd3f5"/>
  <text x="1158" y="203" font-size="18" fill="#0a1f5c">“Review and validate</text>
  <text x="1158" y="226" font-size="18" fill="#0a1f5c">the results”</text>

  <!-- Ask -->
  <path d="M768,254 V322" stroke="#1d4fc4" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <rect x="660" y="278" width="216" height="26" fill="#f6f9fe"/>
  <text x="768" y="298" font-size="19" font-weight="600" fill="#1d4fc4" text-anchor="middle">Asks in plain language</text>

  <!-- Conversation layer -->
  <rect x="587" y="325" width="363" height="160" rx="6" fill="#efe9fc" stroke="#b8a5ea" stroke-width="2"/>
  <text x="768" y="351" font-size="21" font-weight="700" fill="#0a1f5c" text-anchor="middle">Conversation layer</text>
  <rect x="613" y="368" width="311" height="100" rx="6" fill="#0f3fc4"/>
  <path d="M652,418 a26,22 0 1 1 18,20 l-14,10 z" fill="none" stroke="#fff" stroke-width="3"/>
  <g fill="#fff"><circle cx="665" cy="418" r="3"/><circle cx="678" cy="418" r="3"/><circle cx="691" cy="418" r="3"/></g>
  <text x="734" y="404" font-size="21" font-weight="700" fill="#fff">IBM watsonx</text>
  <text x="734" y="430" font-size="21" font-weight="700" fill="#fff">Assistant for Z</text>
  <text x="734" y="456" font-size="21" font-weight="500" fill="#fff">(simulated)</text>

  <!-- Routes from conversation layer to the four steps -->
  <g fill="none" stroke-width="2">
    <path d="M655,485 V502 H217 V535" stroke="#1d4fc4" marker-end="url(#ah)"/>
    <path d="M744,485 V511 H594 V535" stroke="#6929c4" marker-end="url(#ahp)"/>
    <path d="M795,485 V511 H944 V535" stroke="#1d4fc4" marker-end="url(#ah)"/>
    <path d="M884,485 V502 H1258 V535" stroke="#198038" marker-end="url(#ahg)"/>
  </g>

  <!-- Reviews -->
  <path d="M1151,254 V300 H1393 V535" fill="none" stroke="#1d4fc4" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="1352" y="394" width="86" height="26" fill="#f6f9fe"/>
  <text x="1395" y="415" font-size="19" font-weight="600" fill="#1d4fc4" text-anchor="middle">Reviews</text>

  <!-- Step 1 -->
  <rect x="85" y="536" width="300" height="113" rx="6" fill="#e9f1fd" stroke="#9fc0f0" stroke-width="1.5"/>
  <circle cx="109" cy="546" r="20" fill="#0f4fd6"/><text x="109" y="553" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="180" y="575" font-size="20" font-weight="700" fill="#0a1f5c">Catalog lookup</text>
  <g fill="none" stroke="#0a1f5c" stroke-width="3"><circle cx="131" cy="595" r="13"/><path d="M141,605 l12,12"/></g>
  <text x="180" y="601" font-size="17" fill="#0a1f5c">Look up catalog</text>
  <text x="180" y="622" font-size="17" fill="#0a1f5c">information</text>

  <!-- Step 2 -->
  <rect x="420" y="536" width="324" height="113" rx="6" fill="#efe9fc" stroke="#b8a5ea" stroke-width="1.5"/>
  <circle cx="434" cy="546" r="20" fill="#6929c4"/><text x="434" y="553" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="524" y="565" font-size="20" font-weight="700" fill="#0a1f5c">Lineage when catalog</text>
  <text x="524" y="587" font-size="20" font-weight="700" fill="#0a1f5c">is empty</text>
  <g fill="none" stroke="#6929c4" stroke-width="3"><circle cx="450" cy="610" r="6"/><circle cx="488" cy="590" r="6"/><circle cx="488" cy="628" r="6"/><path d="M455,607 L483,593 M455,613 L483,625"/></g>
  <text x="524" y="613" font-size="17" fill="#0a1f5c">Find related objects</text>
  <text x="524" y="634" font-size="17" fill="#0a1f5c">and lineage</text>

  <!-- Step 3 -->
  <rect x="780" y="536" width="290" height="113" rx="6" fill="#e9f1fd" stroke="#9fc0f0" stroke-width="1.5"/>
  <circle cx="799" cy="546" r="20" fill="#0f4fd6"/><text x="799" y="553" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="880" y="575" font-size="19" font-weight="700" fill="#0a1f5c">Locate and validate</text>
  <g fill="none" stroke="#1d4fc4" stroke-width="3"><circle cx="838" cy="610" r="22"/><path d="M827,610 l8,9 l15,-17"/></g>
  <text x="886" y="601" font-size="17" fill="#0a1f5c">Locate in IBM Z estate</text>
  <text x="886" y="622" font-size="17" fill="#0a1f5c">and validate</text>

  <!-- Step 4 -->
  <rect x="1124" y="536" width="328" height="113" rx="6" fill="#e7f5e9" stroke="#8fd09b" stroke-width="1.5"/>
  <circle cx="1140" cy="546" r="20" fill="#198038"/><text x="1140" y="553" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="1244" y="572" font-size="20" font-weight="700" fill="#0a1f5c">Seal evidence</text>
  <path d="M1172,578 h26 l12,12 v36 h-38z" fill="none" stroke="#0a4a22" stroke-width="3"/><path d="M1180,598 h22 M1180,608 h22 M1180,618 h14" stroke="#0a4a22" stroke-width="2.5"/>
  <text x="1244" y="595" font-size="16" fill="#0a1f5c">Create evidence package</text>
  <text x="1244" y="614" font-size="16" fill="#0a1f5c">with source and timestamp</text>
  <text x="1244" y="633" font-size="16" fill="#0a1f5c">per check</text>

  <!-- Step to layer arrows -->
  <g fill="none" stroke-width="2">
    <path d="M217,649 V740 H469" stroke="#1d4fc4" marker-end="url(#ah)"/>
    <path d="M603,649 V683" stroke="#6929c4" marker-end="url(#ahp)"/>
    <path d="M888,649 V683" stroke="#1d4fc4" marker-end="url(#ah)"/>
    <path d="M1298,649 V683" stroke="#198038" marker-end="url(#ahg)"/>
  </g>

  <!-- Discovery layer -->
  <rect x="470" y="684" width="524" height="110" rx="6" fill="#efe9fc" stroke="#b8a5ea" stroke-width="2"/>
  <text x="696" y="709" font-size="21" font-weight="700" fill="#0a1f5c">Discovery layer</text>
  <g fill="#6929c4"><ellipse cx="641" cy="722" rx="30" ry="10"/><path d="M611,722 v22 a30,10 0 0 0 60,0 v-22 a30,10 0 0 1 -60,0z" opacity=".9"/><path d="M611,742 v22 a30,10 0 0 0 60,0 v-22 a30,10 0 0 1 -60,0z" opacity=".8"/></g>
  <text x="696" y="745" font-size="21" font-weight="700" fill="#0a1f5c">IBM ADDI for IBM Z</text>
  <text x="696" y="770" font-size="19" fill="#0a1f5c">(simulated lineage)</text>
  <path d="M994,740 H1127" stroke="#1d4fc4" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- Evidence -->
  <rect x="1128" y="684" width="340" height="113" rx="6" fill="#e7f5e9" stroke="#8fd09b" stroke-width="2"/>
  <text x="1262" y="710" font-size="20" font-weight="700" fill="#0a1f5c">Evidence</text>
  <path d="M1190,716 h28 l12,12 v38 h-40z" fill="none" stroke="#0a4a22" stroke-width="3"/><path d="M1198,738 h24 M1198,748 h24 M1198,758 h15" stroke="#0a4a22" stroke-width="2.5"/>
  <text x="1262" y="735" font-size="17" fill="#0a1f5c">Evidence package:</text>
  <text x="1262" y="757" font-size="17" fill="#0a1f5c">source + timestamp</text>
  <text x="1262" y="779" font-size="17" fill="#0a1f5c">per check</text>

  <!-- Discovery and evidence to the estate -->
  <g fill="none" stroke-width="2" stroke="#1d4fc4">
    <path d="M567,794 V842" marker-end="url(#ah)"/>
    <path d="M905,794 V842" marker-end="url(#ah)"/>
    <path d="M1313,797 V842" marker-end="url(#ah)"/>
  </g>

  <!-- IBM Z estate -->
  <rect x="45" y="817" width="1448" height="137" rx="6" fill="#e9f1fd" stroke="#bcd3f5"/>
  <rect x="75" y="838" width="58" height="96" rx="3" fill="#1b4ea8"/>
  <g fill="#cfe0fb"><rect x="84" y="848" width="10" height="8"/><rect x="100" y="848" width="10" height="8"/><rect x="116" y="848" width="10" height="8"/>
    <rect x="84" y="864" width="10" height="8"/><rect x="100" y="864" width="10" height="8"/><rect x="116" y="864" width="10" height="8"/>
    <rect x="84" y="880" width="10" height="8"/><rect x="100" y="880" width="10" height="8"/><rect x="116" y="880" width="10" height="8"/>
    <rect x="84" y="896" width="10" height="8"/><rect x="100" y="896" width="10" height="8"/><rect x="116" y="896" width="10" height="8"/></g>
  <text x="168" y="866" font-size="24" font-weight="700" fill="#0a1f5c">IBM Z estate</text>
  <text x="168" y="892" font-size="24" font-weight="700" fill="#0a1f5c">(fictional)</text>
  <text x="168" y="918" font-size="16" fill="#5b6578">Data sources used for lookup,</text>
  <text x="168" y="938" font-size="16" fill="#5b6578">lineage and validation</text>

  <rect x="410" y="843" width="328" height="91" rx="6" fill="#fff" stroke="#bcd3f5"/>
  <g fill="none" stroke="#0a1f5c" stroke-width="3"><ellipse cx="481" cy="866" rx="20" ry="7"/><path d="M461,866 v32 a20,7 0 0 0 40,0 v-32 M461,882 a20,7 0 0 0 40,0"/></g>
  <text x="532" y="880" font-size="19" fill="#0a1f5c">Db2 catalog</text>
  <text x="532" y="903" font-size="15" fill="#0a1f5c">SYSCOPY – limited history</text>

  <rect x="771" y="843" width="347" height="91" rx="6" fill="#fff" stroke="#bcd3f5"/>
  <g fill="none" stroke="#0a1f5c" stroke-width="3"><circle cx="845" cy="890" r="11"/><circle cx="865" cy="871" r="9"/><path d="M830,890 h-6 M866,890 h6 M845,875 v-6 M845,905 v6 M856,879 l5,-5 M876,871 h6 M865,859 v-5"/></g>
  <text x="914" y="885" font-size="19" fill="#0a1f5c">Batch jobs and</text>
  <text x="914" y="908" font-size="19" fill="#0a1f5c">COPY utility runs</text>

  <rect x="1151" y="843" width="308" height="91" rx="6" fill="#fff" stroke="#bcd3f5"/>
  <g fill="none" stroke="#0a1f5c" stroke-width="3"><rect x="1199" y="864" width="56" height="22" rx="3"/><rect x="1199" y="890" width="56" height="22" rx="3"/><path d="M1240,875 h8 M1240,901 h8"/></g>
  <text x="1282" y="885" font-size="19" fill="#0a1f5c">z/OS catalog,</text>
  <text x="1282" y="908" font-size="19" fill="#0a1f5c">HSM, virtual tape</text>

  <!-- Footer pill -->
  <rect x="348" y="967" width="840" height="38" rx="19" fill="#e4e7ec"/>
  <text x="768" y="993" font-size="22" fill="#161616" text-anchor="middle">From questions to trusted answers on IBM Z</text>
</svg>
